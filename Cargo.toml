[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.0.3"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
kadr-win = { path = "crates/kadr-win" }
kadr-doc = { path = "crates/kadr-doc" }
kadr-capture = { path = "crates/kadr-capture" }
kadr-render = { path = "crates/kadr-render" }
kadr-editor = { path = "crates/kadr-editor" }
kadr-export = { path = "crates/kadr-export" }
kadr-store = { path = "crates/kadr-store" }
png = "0.18.1"
serde_json = "1.0"
windows-numerics = "0.3.1"
# PaddleOCR: ONNX Runtime loaded at run time from Kadr's ocr folder, so Kadr starts without it.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-31"] }
# Один набор фич на весь workspace: cargo всё равно объединяет их в одну сборку крейта.
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Security_Cryptography",
    "Storage_Streams",
    "Win32_Networking_WinHttp",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
