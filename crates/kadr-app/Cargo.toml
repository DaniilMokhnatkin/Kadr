[package]
name = "kadr-app"
description = "Kadr — резидентный скриншотер: трей, хоткеи, оркестрация"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "kadr"
path = "src/main.rs"

[features]
# Манифест с uiAccess="true". Такая сборка запускается только подписанной и из Program Files.
uiaccess = []

[dependencies]
windows-numerics.workspace = true
kadr-win.workspace = true
kadr-doc.workspace = true
kadr-capture.workspace = true
kadr-render.workspace = true
kadr-editor.workspace = true
kadr-export.workspace = true
kadr-store.workspace = true
png.workspace = true
serde_json.workspace = true
ort.workspace = true
windows.workspace = true
rqrr = { version = "0.11.0", default-features = false }
gif = "0.14.2"

[dev-dependencies]
qrcode = { version = "0.14.1", default-features = false }
